<!DOCTYPE html>
<html>
<head>
<style>
    /* Define page size and margins. Removed non-standard @frame rule which caused a linter/error.
       Footer is positioned using normal flow and page margins. */
    @page {
        size: A4;
        margin: 2cm 1.5cm;
    }

    body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 10pt;
        color: #1a1a1a;
    }

    .header {
        border-bottom: 2px solid #2c5f2d;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    .header h1 {
        font-size: 16pt;
        color: #2c5f2d;
        margin: 0;
    }

    .header .subtitle {
        font-size: 9pt;
        color: #666666;
        margin-top: 2px;
    }

    .meta {
        font-size: 8pt;
        color: #888888;
        margin-bottom: 15px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th {
        background-color: #2c5f2d;
        color: #ffffff;
        text-align: left;
        padding: 6px 8px;
        font-size: 9pt;
    }

    td {
        padding: 6px 8px;
        border-bottom: 1px solid #dddddd;
        font-size: 9pt;
    }

    tr:nth-child(even) {
        background-color: #f5f5f5;
    }

    #footer_content {
        font-size: 8pt;
        color: #888888;
        text-align: center;
        border-top: 1px solid #dddddd;
        padding-top: 5px;
    }
</style>
</head>
<body>

<div class="header">
    <h1>{{ org_name | default("Vets For Future") }}</h1>
    <div class="subtitle">{{ report_title }}</div>
</div>

<div class="meta">Generated: {{ generated_at }}</div>

{% block content %}{% endblock %}

<div id="footer_content">
    VFF Integrated Management System &mdash; Confidential
</div>

</body>
</html>
